<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotina da Viagem</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Suavização de transições */
        .task-enter { transition: all 0.3s ease-out; opacity: 0; transform: translateY(-10px); }
        .task-enter-active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans antialiased pb-24 transition-colors duration-300">

    <!-- Cabeçalho Fixo -->
    <header class="bg-blue-600 dark:bg-blue-800 text-white p-4 sticky top-0 z-10 shadow-md">
        <h1 class="text-xl font-bold text-center">Checklist da Viagem</h1>
        <p class="text-sm text-center text-blue-200 mt-1" id="header-date"></p>
    </header>

    <main class="max-w-md mx-auto p-4" id="app-container">
        <!-- Os dias serão injetados aqui via JavaScript -->
    </main>

    <!-- Botão Adicionar Dia Fixo na Base -->
    <div class="fixed bottom-0 left-0 w-full bg-white dark:bg-gray-800 border-t dark:border-gray-700 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] flex justify-center">
        <button onclick="addNewDay()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-full shadow-lg flex items-center gap-2 transition-transform transform active:scale-95">
            <i class="fa-solid fa-calendar-plus"></i> Adicionar Novo Dia
        </button>
    </div>

    <script>
        const STORAGE_KEY = 'tarefas_viagem_v3';
        let appData = [];

        // Data de início estipulada
        const startDate = new Date(2026, 8, 21); // 21/09/2026

        function formatDateBR(date) {
            return date.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }).toUpperCase();
        }

        // Gera os dados iniciais se não houver nada no localStorage
        function generateInitialData() {
            let data = [];
            for (let i = 0; i < 40; i++) {
                let currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);
                
                let dayOfWeek = currentDate.getDay(); // 0 = Dom, 1 = Seg... 6 = Sáb
                let dateString = currentDate.toISOString().split('T')[0];
                let isBillDay = (currentDate.getDate() === 4 && currentDate.getMonth() === 9); // 04/10

                let tasks = [
                    { id: crypto.randomUUID(), text: 'Passar o aspirador de pó (focar no quarto)', done: false },
                    { id: crypto.randomUUID(), text: 'Cuidar do Tom (colocar ração, água nova e limpar areia)', done: false }
                ];

                if (i % 2 === 0) tasks.push({ id: crypto.randomUUID(), text: 'Jogar água nas plantas de baixo (manhã)', done: false });
                if (dayOfWeek === 2 || dayOfWeek === 5) tasks.push({ id: crypto.randomUUID(), text: 'Jogar água nas plantas do terraço', done: false });
                if (dayOfWeek === 1 || dayOfWeek === 3 || dayOfWeek === 5) tasks.push({ id: crypto.randomUUID(), text: 'Tirar lixo para fora (banheiro/cozinha) - esquina', done: false });
                if (dayOfWeek === 6) {
                    tasks.push({ id: crypto.randomUUID(), text: 'Trocar roupa de cama e toalhas', done: false });
                    tasks.push({ id: crypto.randomUUID(), text: 'Colocar cuecas e uniforme na máquina para lavar', done: false });
                }
                if (isBillDay) tasks.unshift({ id: crypto.randomUUID(), text: '⚠️ PAGAR CONTAS (Água e Luz)', done: false });

                data.push({
                    id: crypto.randomUUID(),
                    date: dateString,
                    label: formatDateBR(currentDate),
                    tasks: tasks,
                    isOpen: false
                });
            }
            return data;
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            render();
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                appData = JSON.parse(saved);
            } else {
                appData = generateInitialData();
                saveData();
            }
            
            // Define o dia atual no cabeçalho e tenta abrir o card de hoje
            document.getElementById('header-date').innerText = "Hoje é " + formatDateBR(new Date());
            openTodayCard();
            render();
        }

        function openTodayCard() {
            let todayStr = new Date().toISOString().split('T')[0];
            let found = false;
            appData.forEach(day => {
                if (day.date === todayStr) {
                    day.isOpen = true;
                    found = true;
                } else {
                    day.isOpen = false;
                }
            });
        }

        function toggleDay(dayId) {
            let day = appData.find(d => d.id === dayId);
            day.isOpen = !day.isOpen;
            saveData();
        }

        function toggleTask(dayId, taskId) {
            let day = appData.find(d => d.id === dayId);
            let task = day.tasks.find(t => t.id === taskId);
            task.done = !task.done;
            saveData();
        }

        function addTask(dayId) {
            let input = document.getElementById(`input-${dayId}`);
            let text = input.value.trim();
            if (text) {
                let day = appData.find(d => d.id === dayId);
                day.tasks.push({ id: crypto.randomUUID(), text: text, done: false });
                input.value = '';
                saveData();
            }
        }

        function deleteTask(dayId, taskId) {
            if(confirm('Tem certeza que deseja apagar esta tarefa?')) {
                let day = appData.find(d => d.id === dayId);
                day.tasks = day.tasks.filter(t => t.id !== taskId);
                saveData();
            }
        }

        function editTask(dayId, taskId) {
            let day = appData.find(d => d.id === dayId);
            let task = day.tasks.find(t => t.id === taskId);
            let newText = prompt('Edite a tarefa:', task.text);
            if (newText !== null && newText.trim() !== '') {
                task.text = newText.trim();
                saveData();
            }
        }

        function addNewDay() {
            let lastDay = appData[appData.length - 1];
            let nextDate = new Date(lastDay.date);
            nextDate.setDate(nextDate.getDate() + 1);
            
            appData.push({
                id: crypto.randomUUID(),
                date: nextDate.toISOString().split('T')[0],
                label: formatDateBR(nextDate),
                tasks: [],
                isOpen: true
            });
            saveData();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function calculateProgress(tasks) {
            if (tasks.length === 0) return 0;
            let done = tasks.filter(t => t.done).length;
            return Math.round((done / tasks.length) * 100);
        }

        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            appData.forEach(day => {
                let progress = calculateProgress(day.tasks);
                let progressColor = progress === 100 ? 'bg-green-500' : 'bg-blue-500';

                let dayCard = document.createElement('div');
                dayCard.className = 'mb-4 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden';
                
                // Header do Dia (Clicável)
                let header = `
                    <div class="p-4 flex justify-between items-center cursor-pointer bg-gray-50 hover:bg-gray-100 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors" onclick="toggleDay('${day.id}')">
                        <div class="flex items-center gap-3">
                            <h2 class="font-semibold text-lg">${day.label}</h2>
                            ${progress === 100 && day.tasks.length > 0 ? '<i class="fa-solid fa-circle-check text-green-500 text-xl"></i>' : ''}
                        </div>
                        <i class="fa-solid fa-chevron-${day.isOpen ? 'up' : 'down'} text-gray-500"></i>
                    </div>
                    <div class="h-1.5 w-full bg-gray-200 dark:bg-gray-600">
                        <div class="h-1.5 ${progressColor} transition-all duration-500 ease-in-out" style="width: ${progress}%"></div>
                    </div>
                `;

                // Corpo de Tarefas
                let body = '';
                if (day.isOpen) {
                    let tasksHtml = day.tasks.map(task => `
                        <div class="flex items-start justify-between p-3 border-b dark:border-gray-700 group hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors">
                            <label class="flex items-start gap-3 cursor-pointer flex-1">
                                <div class="relative flex items-center justify-center mt-1">
                                    <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask('${day.id}', '${task.id}')" class="peer h-6 w-6 cursor-pointer appearance-none rounded-md border-2 border-gray-300 dark:border-gray-600 checked:border-blue-600 checked:bg-blue-600 transition-all">
                                    <i class="fa-solid fa-check absolute text-white opacity-0 peer-checked:opacity-100 pointer-events-none text-sm"></i>
                                </div>
                                <span class="flex-1 mt-1 leading-tight ${task.done ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-700 dark:text-gray-200'} transition-all">${task.text}</span>
                            </label>
                            <div class="flex gap-2 ml-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                <button onclick="editTask('${day.id}', '${task.id}')" class="text-gray-400 hover:text-blue-500 p-2"><i class="fa-solid fa-pen text-sm"></i></button>
                                <button onclick="deleteTask('${day.id}', '${task.id}')" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash text-sm"></i></button>
                            </div>
                        </div>
                    `).join('');

                    if (day.tasks.length === 0) {
                        tasksHtml = `<p class="text-center text-gray-400 dark:text-gray-500 py-4 text-sm">Nenhuma tarefa para este dia.</p>`;
                    }

                    // Input de Adicionar Tarefa
                    let inputHtml = `
                        <div class="p-3 bg-gray-50 dark:bg-gray-750 flex gap-2">
                            <input type="text" id="input-${day.id}" placeholder="Adicionar nova tarefa..." class="flex-1 px-3 py-2 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" onkeypress="if(event.key === 'Enter') addTask('${day.id}')">
                            <button onclick="addTask('${day.id}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    `;

                    body = `<div class="task-enter-active">${tasksHtml}${inputHtml}</div>`;
                }

                dayCard.innerHTML = header + body;
                container.appendChild(dayCard);
            });
        }

        // Inicializa o app
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>

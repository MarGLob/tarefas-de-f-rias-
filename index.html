<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Meta tags para melhorar a experiência ao adicionar à tela inicial do celular -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#3b82f6">
    
    <title>Tarefas Casa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        
        .task-checkbox:checked + label {
            text-decoration: line-through;
            color: #9ca3af;
        }
        
        .sticky-date {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Melhorando a área de toque para celular */
        .task-row {
            min-height: 3rem;
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-12">

    <div class="max-w-3xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Header Section -->
        <header class="bg-white rounded-2xl shadow-sm p-6 mb-8 text-center border-t-4 border-blue-500">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Controle de Tarefas</h1>
            <div class="bg-blue-50 text-blue-800 p-4 rounded-lg text-sm inline-block">
                <i class="fa-solid fa-calendar-days mr-2"></i>
                <span class="font-semibold">Período:</span> 21/09/2026 até 30/10/2026
            </div>
            <div class="mt-4 flex justify-center space-x-4">
                <button id="resetBtn" class="text-sm text-red-500 hover:text-red-700 transition-colors p-2">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Limpar Seleções
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main>
            <div id="loading" class="text-center py-10">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-500"></i>
                <p class="mt-2 text-gray-500">Carregando lista...</p>
            </div>
            
            <div id="days-container" class="space-y-6 hidden">
                <!-- Days will be dynamically injected here by JS -->
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startDate = new Date(2026, 8, 21); // Mês 8 = Setembro, Dia 21
            const totalDays = 40;
            const container = document.getElementById('days-container');
            const loading = document.getElementById('loading');
            const resetBtn = document.getElementById('resetBtn');

            // --- Definição das Tarefas ---
            const getTasksForDate = (date, dayIndex) => {
                const dayOfWeek = date.getDay(); // 0 = Domingo, 1 = Segunda...
                const dateString = date.toLocaleDateString('pt-BR');
                const isDay0410 = date.getDate() === 4 && date.getMonth() === 9; // 04 de Outubro

                // Tarefas diárias
                let tasks = [
                    { id: `t1_${dayIndex}`, desc: "Passar aspirador de pó (focar no seu quarto)", icon: "fa-solid fa-broom" },
                    { id: `t2_${dayIndex}`, desc: "Colocar ração para os gatos", icon: "fa-solid fa-cat" },
                    { id: `t3_${dayIndex}`, desc: "Limpar a areia dos gatos", icon: "fa-solid fa-poop" },
                    { id: `t4_${dayIndex}`, desc: "Trocar a água dos gatos", icon: "fa-solid fa-droplet" }
                ];

                // 1. Plantas de baixo (De 2 em 2 dias)
                if (dayIndex % 2 === 0) {
                    tasks.unshift({ id: `p1_${dayIndex}`, desc: "Jogar água nas plantas de baixo (manhã)", icon: "fa-solid fa-leaf" });
                }

                // 2. Plantas do terraço (Terças e Sextas)
                if (dayOfWeek === 2 || dayOfWeek === 5) {
                    tasks.unshift({ id: `p2_${dayIndex}`, desc: "Jogar água nas plantas do terraço", icon: "fa-brands fa-pagelines" });
                }

                // 3. Roupa de cama e banho (Sábado)
                if (dayOfWeek === 6) { 
                    tasks.push({ id: `l1_${dayIndex}`, desc: "Trocar roupa de cama e toalha", icon: "fa-solid fa-bed" });
                    tasks.push({ id: `l2_${dayIndex}`, desc: "Lavar: cuecas, blusas de uniforme", icon: "fa-solid fa-shirt" });
                }

                // 4. Lixo (Segunda, Quarta, Sexta)
                if (dayOfWeek === 1 || dayOfWeek === 3 || dayOfWeek === 5) {
                    tasks.push({ id: `g1_${dayIndex}`, desc: "Tirar lixo (banheiro, cozinha) para fora", icon: "fa-solid fa-trash-can" });
                }

                // 5. Pagar contas (Dia 04/10)
                if (isDay0410) {
                    tasks.push({ id: `b1_${dayIndex}`, desc: "⚠️ PAGAR CONTAS (água e luz)", icon: "fa-solid fa-file-invoice-dollar", color: "text-amber-600 font-bold" });
                }

                return tasks;
            };

            // --- Geração da Interface ---
            const renderDays = () => {
                let htmlContent = '';
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                for (let i = 0; i < totalDays; i++) {
                    const currentDate = new Date(startDate);
                    currentDate.setDate(startDate.getDate() + i);
                    
                    const dateStr = currentDate.toLocaleDateString('pt-BR');
                    const dayName = currentDate.toLocaleDateString('pt-BR', { weekday: 'long' });
                    const dayNameCap = dayName.charAt(0).toUpperCase() + dayName.slice(1);
                    
                    const tasks = getTasksForDate(currentDate, i);
                    const isToday = currentDate.getTime() === today.getTime();
                    
                    let dayCardClasses = "bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden";
                    let headerClasses = "bg-gray-50 px-4 py-3 border-b border-gray-100 flex justify-between items-center sticky-date";
                    
                    if (isToday) {
                        dayCardClasses += " ring-2 ring-blue-500 shadow-md";
                        headerClasses = "bg-blue-500 text-white px-4 py-3 flex justify-between items-center sticky-date";
                    }

                    let tasksHtml = tasks.map(task => {
                        const iconColor = task.color || "text-gray-400";
                        const textColor = task.color || "text-gray-700";
                        return `
                            <div class="task-row flex items-center p-3 hover:bg-gray-50 transition-colors border-b border-gray-50 last:border-0">
                                <div class="flex-shrink-0 flex items-center h-full">
                                    <input type="checkbox" id="${task.id}" class="task-checkbox h-6 w-6 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                                </div>
                                <label for="${task.id}" class="ml-4 flex-1 block cursor-pointer select-none py-1">
                                    <i class="${task.icon} ${iconColor} w-6 text-center mr-2"></i>
                                    <span class="${textColor}">${task.desc}</span>
                                </label>
                            </div>
                        `;
                    }).join('');

                    htmlContent += `
                        <div class="${dayCardClasses}" id="day-${i}">
                            <div class="${headerClasses}">
                                <div>
                                    <h2 class="text-lg font-semibold ${isToday ? 'text-white' : 'text-gray-800'}">Dia ${i + 1}</h2>
                                    <p class="text-sm ${isToday ? 'text-blue-100' : 'text-gray-500'}">${dayNameCap}, ${dateStr}</p>
                                </div>
                                ${isToday ? '<span class="px-2 py-1 bg-white text-blue-600 text-xs font-bold rounded shadow-sm">HOJE</span>' : ''}
                            </div>
                            <div class="p-1">
                                ${tasksHtml}
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = htmlContent;
                loading.classList.add('hidden');
                container.classList.remove('hidden');

                setupStateManagement();
                scrollToToday();
            };

            // --- Gerenciamento de Estado (Local Storage) ---
            const setupStateManagement = () => {
                const checkboxes = document.querySelectorAll('.task-checkbox');
                
                // Carrega o estado salvo do navegador
                const savedState = JSON.parse(localStorage.getItem('minhasTarefasState')) || {};
                
                checkboxes.forEach(checkbox => {
                    if (savedState[checkbox.id]) {
                        checkbox.checked = true;
                    }
                    
                    // Salva automaticamente a cada clique
                    checkbox.addEventListener('change', (e) => {
                        const state = JSON.parse(localStorage.getItem('minhasTarefasState')) || {};
                        state[e.target.id] = e.target.checked;
                        localStorage.setItem('minhasTarefasState', JSON.stringify(state));
                    });
                });

                resetBtn.addEventListener('click', () => {
                    if(confirm("Deseja realmente apagar todo o seu progresso?")) {
                        localStorage.removeItem('minhasTarefasState');
                        checkboxes.forEach(cb => cb.checked = false);
                    }
                });
            };

            const scrollToToday = () => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                let todayIndex = -1;
                for (let i = 0; i < totalDays; i++) {
                    const d = new Date(startDate);
                    d.setDate(startDate.getDate() + i);
                    if(d.getTime() === today.getTime()){
                        todayIndex = i;
                        break;
                    }
                }

                if (todayIndex !== -1) {
                    const todayElement = document.getElementById(`day-${todayIndex}`);
                    if(todayElement) {
                        setTimeout(() => {
                            // Calcula a posição considerando uma pequena margem para o cabeçalho não cobrir
                            const yOffset = -20; 
                            const y = todayElement.getBoundingClientRect().top + window.pageYOffset + yOffset;
                            window.scrollTo({top: y, behavior: 'smooth'});
                        }, 300);
                    }
                }
            };

            // Iniciar a aplicação
            renderDays();
        });
    </script>
</body>
</html>
